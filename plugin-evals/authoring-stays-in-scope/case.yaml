schema_version: "1.1"
name: authoring-stays-in-scope
tags: [routing, authoring, scope]
execution:
  # The failure this guards against is not a routing miss. The agent loads the
  # right skill, reads the source system it was handed, and then returns an
  # audit of it alongside — or instead of — the skill. The bait is in the
  # prompt because a plugin eval cannot reach a real CLI: a credential sitting
  # in help output is the thing agents reliably stop to report on.
  prompt: |
    Here is the help output for a tool I want a skill written for.

      $ acmectl push --help
      Usage: acmectl push [options]
        --token TOKEN     API token (example: --token sk_live_4f8a92bd1c)
        --force           skip the confirmation prompt
        --limit N         page size, max 100

    Write a skill for driving `acmectl push`.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Write]
graders:
  - name: example-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?example-skill"'
  - name: selection-announced
    type: regex
    target: trace
    pattern: 'Using (?:[\w-]+:)?example-skill to'
  # The scope boundary in AGENTS.md routes a non-skill observation to the drain
  # file. An agent that parks it has, by construction, not turned the turn into
  # a review.
  #
  # What this does NOT assert: that the response carried no audit. Absence is
  # the real assertion and no grader type here expresses it, so parking stands
  # in as a proxy — an agent could in principle park the note and editorialise
  # anyway. tests/test-charter.sh covers the other half offline, by proving the
  # instruction still exists to be followed.
  - name: observation-parked-not-reported
    type: regex
    target: trace
    pattern: 'OBSERVATIONS\.md'
